name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        platform: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        yocto-release: [scarthgap, wrynose]
        include:
          # system python of ubuntu 22.04
          - platform: ubuntu-22.04
            python-version: "3.10"
            yocto-release: scarthgap
          - platform: ubuntu-22.04
            python-version: "3.10"
            yocto-release: wrynose

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install tox tox-gh-actions
        sudo apt-get update
        sudo apt-get install -y build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd
        sudo locale-gen en_US.UTF-8
    - name: Allow unprivileged user namespaces
      # bitbake uses user namespaces to disable network access in tasks,
      # but ubuntu 24.04 restricts them with AppArmor by default.
      if: matrix.platform == 'ubuntu-24.04'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Test with tox
      env:
        YOCTO_RELEASE: ${{ matrix.yocto-release }}
        LANG: en_US.UTF-8
      run: tox
