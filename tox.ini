[tox]
envlist = py310,py311,py312,py313,py314

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
deps = pytest
passenv = YOCTO_RELEASE
commands = \
  pytest {toxinidir}/tests -qq -c {toxinidir}/tests/pytest_{env:YOCTO_RELEASE:scarthgap}.ini -s -x
